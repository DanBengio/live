<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>Live</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Navigateurs trop anciens (module PowerPoint dans PowerPoint 2016 / 2019, qui utilise le moteur
      // d'Internet Explorer) : l'application ne démarre pas. Au lieu d'un écran vide, on explique quoi faire.
      // JavaScript volontairement ancien (ES5) pour tourner partout.
      setTimeout(function () {
        var root = document.getElementById('root')
        if (!root || root.children.length) return
        var addin = location.pathname.indexOf('/addin') === 0
        root.innerHTML =
          '<div style="font-family:Segoe UI,Arial,sans-serif;color:#fff;padding:6%;font-size:22px;line-height:1.4">' +
          '<div style="font-size:30px;font-weight:bold;margin-bottom:16px">Live</div>' +
          (addin
            ? 'Cette version de PowerPoint est trop ancienne pour afficher Live dans la diapo.<br><br>' +
              'Solution : sur votre page coach, téléchargez la <b>présentation sans module</b>, ' +
              'puis utilisez <b>« Présenter depuis le navigateur »</b> au moment des questions (Alt + Tab).<br><br>' +
              '<span style="color:#9ca3af">Ou mettez à jour Office vers Microsoft 365.</span>'
            : 'Ce navigateur est trop ancien pour Live. Ouvrez cette page dans Chrome, Edge, Firefox ou Safari.') +
          '</div>'
      }, 5000)
    </script>
  </body>
</html>
