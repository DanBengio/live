<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>Live</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Module PowerPoint dans un moteur trop ancien (PowerPoint 2016 / 2019) : version compatible.
      // On teste une syntaxe récente ; si le moteur ne la comprend pas, l'application moderne ne
      // démarrerait pas. ES5 volontairement.
      if (location.pathname.indexOf('/addin') === 0) {
        var modern = true
        try {
          new Function('const a = { b: 1 }; return a?.b ?? 0')
        } catch (e) {
          modern = false
        }
        if (!modern) location.replace('/addin/legacy.html' + location.search)
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Filet de sécurité si l'application ne démarre pas (connexion lente, ancienne page gardée en
      // mémoire par PowerPoint…) : on recharge une fois tout seul, puis on explique quoi faire.
      // JavaScript volontairement ancien (ES5) pour tourner partout.
      ;(function () {
        var key = 'live-retry:' + location.pathname
        setTimeout(function () {
          var store = null
          try {
            store = window.sessionStorage
          } catch (e) {}
          if (window.__liveStarted) {
            if (store) store.removeItem(key)
            return
          }
          if (store && !store.getItem(key)) {
            store.setItem(key, '1')
            var sep = location.search ? '&' : '?'
            location.replace(location.pathname + location.search + sep + 'r=' + new Date().getTime())
            return
          }
          if (store) store.removeItem(key)
          var root = document.getElementById('root')
          if (!root) return
          var addin = location.pathname.indexOf('/addin') === 0
          root.innerHTML =
            '<div style="font-family:Segoe UI,Arial,sans-serif;color:#fff;padding:6%;font-size:22px;line-height:1.4">' +
            '<div style="font-size:30px;font-weight:bold;margin-bottom:16px">Live</div>' +
            (addin
              ? 'Live n’a pas pu se charger (connexion lente ?).<br><br>' +
                'Fermez complètement PowerPoint, puis rouvrez la présentation.<br><br>' +
                '<span style="color:#9ca3af">Si ça continue : « Présenter depuis le navigateur » sur votre page coach.</span>'
              : 'Live n’a pas pu se charger. Rechargez la page, ou ouvrez-la dans Chrome, Edge, Firefox ou Safari.') +
            '</div>'
        }, 12000)
      })()
    </script>
  </body>
</html>
